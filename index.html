<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ansible Practical</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    text-align: center;
  }

  h1 {
    background: #222;
    padding: 15px;
    margin: 0;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    padding: 20px;
    max-width: 1100px;
    margin: 0 auto;
  }

  .card {
    background: #1a1a1a;
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    overflow: hidden;
    min-height: 240px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }

  .card img {
    width: 100%;
    display: block;
    object-fit: cover;
    aspect-ratio: 4 / 3;
    cursor: pointer;
    transition: transform 0.2s ease;
  }

  .card img:hover {
    transform: scale(1.03);
  }

  .caption {
    padding: 12px 14px;
    font-size: 14px;
    color: #ddd;
    word-break: break-word;
    text-align: left;
  }

  .message {
    padding: 40px 20px;
    color: #bbb;
    font-size: 18px;
  }

  .fullscreen {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.95);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 10;
    padding: 20px;
  }

  .fullscreen img {
    max-width: 100%;
    max-height: 90vh;
    border-radius: 12px;
  }

  .close {
    position: absolute;
    top: 18px;
    right: 18px;
    font-size: 30px;
    color: white;
    cursor: pointer;
  }

  .fullscreen .caption {
    margin-top: 14px;
    font-size: 16px;
    color: #eee;
  }
</style>
</head>

<body>

<h1>Ansible Practical</h1>

<div class="gallery" id="gallery"></div>
<div class="message" id="message"></div>

<div class="fullscreen" id="fs">
  <div class="close" onclick="closeFull()">✖</div>
  <img id="fsimg" />
  <div class="caption" id="fsname"></div>
</div>

<script>
/*
  🔥 AUTO-DETECT LOGIC:
  It tries:
  images/1.jpg, images/2.jpg, images/3.jpg ...
*/

const images = [
  "docker-repo.png",
  "logs-01.png",
  "logs-02.png",
  "logs-03.png",
  "spring-petclinic.png"
];
const folder = "images/";

function buildGallery() {
  const gallery = document.getElementById("gallery");
  const message = document.getElementById("message");
  gallery.innerHTML = "";
  message.innerText = "";

  if (images.length === 0) {
    message.innerText = "No images found in the images folder.";
    return;
  }

  images.forEach((file) => {
    const path = folder + file;
    const card = document.createElement("div");
    card.className = "card";

    const thumb = document.createElement("img");
    thumb.src = path;
    thumb.alt = file;
    thumb.onclick = () => openFull(path, file);

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.innerText = file;

    card.appendChild(thumb);
    card.appendChild(caption);
    gallery.appendChild(card);
  });
}

function openFull(path, file) {
  const fs = document.getElementById("fs");
  const fsimg = document.getElementById("fsimg");
  const fsname = document.getElementById("fsname");

  fsimg.src = path;
  fsname.innerText = file;
  fs.style.display = "flex";
}

function closeFull() {
  document.getElementById("fs").style.display = "none";
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeFull();
});

buildGallery();
</script>

</body>
</html>
